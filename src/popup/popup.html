<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>JustClick</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="logo">JC</span>
        <div>
          <h1>JustClick</h1>
          <p class="tagline">只点一下，填完求职表单</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section id="pending-banner" class="pending" hidden>
        <div class="pending-head">
          <span id="pending-title">你有 0 个待填项</span>
          <span class="pending-actions">
            <button id="pending-toggle" class="link" type="button">展开</button>
            <button id="pending-clear" class="link" type="button" hidden>全部忽略</button>
          </span>
        </div>
        <div id="pending-list" class="pending-list" hidden></div>
      </section>

      <button id="fill-btn" class="primary" type="button">一键填充当前页面</button>
      <div class="actions-row">
        <button id="learn-btn" class="secondary" type="button">从当前页学习</button>
      </div>

      <div id="result" class="result" hidden></div>

      <section id="report" class="report" hidden>
        <div class="report-head">
          <strong id="report-title">填充报告</strong>
          <span id="report-time" class="report-time"></span>
        </div>

        <div class="report-block" id="block-filled">
          <h3 id="filled-title">已填 0 项</h3>
          <ul id="filled-list" class="report-list"></ul>
        </div>

        <div class="report-block" id="block-missing" hidden>
          <h3 id="missing-title">待填 0 项</h3>
          <p class="block-hint">在这里补值会立刻填进页面，只填值，不会提交表单。</p>
          <div id="missing-list" class="missing-list"></div>
        </div>

        <details class="report-block collapse" id="block-unmatched" hidden>
          <summary id="unmatched-title">未匹配 0 项（简历有值、页面没有对应输入框）</summary>
          <ul id="unmatched-list" class="report-list"></ul>
        </details>

        <div class="report-actions">
          <button id="copy-report" class="ghost small" type="button">复制报告</button>
          <span id="copy-status" class="report-time"></span>
        </div>
      </section>

      <section id="learn-panel" class="learn" hidden>
        <div class="learn-head">
          <span>从当前页学习</span>
          <button id="learn-close" class="link" type="button">关闭</button>
        </div>
        <p class="learn-hint">
          给每个字段选一个目标（或忽略），保存后这些规则会优先于 ATS 与内置字典。
        </p>
        <div id="learn-list" class="learn-list"></div>
        <label class="check">
          <input id="learn-scope" type="checkbox" checked />
          <span id="learn-scope-label">只在此站点生效</span>
        </label>
        <div class="actions-row">
          <button id="learn-save" class="primary" type="button">保存规则</button>
        </div>
        <p id="learn-status" class="learn-status"></p>
      </section>

      <section class="profile">
        <div class="profile-head">
          <span>简历完整度</span>
          <strong id="completeness">0 / 11</strong>
        </div>
        <div class="bar"><i id="completeness-bar"></i></div>
        <p id="profile-name" class="profile-name">尚未填写简历</p>
        <div id="missing-chips" class="chips"></div>
        <p id="updated-at" class="updated"></p>
      </section>

      <p class="hint">
        支持 Greenhouse / Lever / Workday 等常见职位表单。已填字段会高亮 2 秒。
      </p>
    </main>

    <footer class="foot">
      <button id="options-btn" class="link" type="button">编辑简历</button>
      <span class="dot">·</span>
      <button id="refresh-btn" class="link" type="button">刷新</button>
    </footer>

    <script src="../lib/resume-schema.js"></script>
    <script src="../lib/rules.js"></script>
    <script src="../lib/storage.js"></script>
    <script src="../lib/learner.js"></script>
    <script src="../lib/template.js"></script>
    <script src="../lib/report.js"></script>
    <script src="../lib/supplement.js"></script>
    <script src="../lib/pending.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
