<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Boss 直聘 — 投递简历（mock）</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  .dialog-wrap { max-width: 460px; margin: 64px auto; background: #fff; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .dialog-header { padding: 16px 20px; border-bottom: 1px solid #eee; font-size: 16px; font-weight: 600; }
  .dialog-body { padding: 20px; }
  .form-item { margin-bottom: 16px; }
  .form-item label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
  .form-item input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px; border: 1px solid #dcdfe6; border-radius: 4px; }
  .dialog-footer { padding: 0 20px 20px; }
  .btn-send { width: 100%; padding: 10px; border: 0; border-radius: 4px; background: #00a6a7; color: #fff; font-size: 14px; }
</style>
</head>
<body>
  <div class="dialog-wrap" role="dialog" aria-label="投递简历">
    <div class="dialog-header">投递简历</div>
    <div class="dialog-body">
      <div class="form-item">
        <label for="zp-name">姓名</label>
        <input id="zp-name" name="name" type="text" autocomplete="off">
      </div>
      <div class="form-item">
        <label for="zp-phone">手机号</label>
        <input id="zp-phone" name="phone" type="tel" autocomplete="off">
      </div>
      <div class="form-item">
        <label for="zp-email">邮箱</label>
        <input id="zp-email" name="email" type="email" autocomplete="off">
      </div>
    </div>
    <div class="dialog-footer">
      <button class="btn-send" type="button" id="zp-send"
              onclick="window.__sent = (window.__sent || 0) + 1;">发送</button>
    </div>
  </div>
  <script>
    window.__sent = 0;
  </script>
</body>
</html>
